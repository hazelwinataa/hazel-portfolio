<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="625" viewBox="0 0 1200 625"><rect width="1200" height="625" rx="26" fill="#f6f9fc"/><g font-family="Arial,sans-serif"><text x="56" y="69" fill="#18364b" font-size="31" font-weight="700">Waste classification · Experiment workflow</text><text x="56" y="101" fill="#57778a" font-size="17">Stratified data preparation, model comparisons, and attention-map analysis</text><rect x="55" y="157" width="1090" height="348" rx="18" fill="#ffffff" stroke="#d3e3ea" stroke-width="2"/><rect x="78" y="226" width="194" height="169" rx="15" fill="#f1f7f9" stroke="#c9dfe5" stroke-width="2"/><text x="90" y="263" font-size="16" fill="#226078" font-weight="700">01 · EDA</text><text x="90" y="310" font-size="18" fill="#234459">2,527 RGB images</text><text x="90" y="341" font-size="14" fill="#668195">Six imbalanced classes</text><rect x="292" y="226" width="194" height="169" rx="15" fill="#f1f7f9" stroke="#c9dfe5" stroke-width="2"/><text x="304" y="263" font-size="16" fill="#226078" font-weight="700">02 · SPLIT</text><text x="304" y="310" font-size="18" fill="#234459">70 / 15 / 15</text><text x="304" y="341" font-size="14" fill="#668195">1,768 / 379 / 380</text><rect x="506" y="226" width="194" height="169" rx="15" fill="#f1f7f9" stroke="#c9dfe5" stroke-width="2"/><text x="518" y="263" font-size="16" fill="#226078" font-weight="700">03 · PREPARE</text><text x="518" y="310" font-size="18" fill="#234459">224 × 224</text><text x="518" y="341" font-size="14" fill="#668195">tf.data + augmentation</text><rect x="720" y="226" width="194" height="169" rx="15" fill="#f1f7f9" stroke="#c9dfe5" stroke-width="2"/><text x="732" y="263" font-size="16" fill="#226078" font-weight="700">04 · MODEL</text><text x="732" y="310" font-size="18" fill="#234459">Four variants</text><text x="732" y="341" font-size="14" fill="#668195">CNNs and MobileNetV2</text><rect x="934" y="226" width="194" height="169" rx="15" fill="#f1f7f9" stroke="#c9dfe5" stroke-width="2"/><text x="946" y="263" font-size="16" fill="#226078" font-weight="700">05 · EXPLAIN</text><text x="946" y="310" font-size="18" fill="#234459">Grad-CAM</text><text x="946" y="341" font-size="14" fill="#668195">Review visual attention</text><text x="80" y="445" font-size="18" fill="#47687a">All models share the dataset; candidate training and evaluation configurations differ.</text><text x="56" y="587" fill="#5b7a89" font-size="15">Explanatory diagram based on code in the team's two uploaded notebooks.</text></g></svg>