<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590"><rect width="1200" height="590" rx="20" fill="#f6f9fc"/><g font-family="Arial,sans-serif"><text x="54" y="58" font-size="30" font-weight="700" fill="#142d43">Cherry disease classification · Evaluation evidence</text><text x="54" y="91" font-size="17" fill="#4d7186">Original 5-class CNN experiments: from scratch AlexNet to ImageNet-pretrained EfficientNetB0</text><rect x="55" y="139" width="1090" height="332" rx="18" fill="#fff" stroke="#d7e3ec"/><text x="85" y="202" font-size="22" fill="#315569">Manual AlexNet (baseline)</text><text x="742" y="204" font-size="29" font-weight="700" fill="#536e82">27.11% accuracy</text><text x="85" y="271" font-size="22" fill="#315569">EfficientNetB0 transfer learning</text><text x="742" y="273" font-size="29" font-weight="700" fill="#167f90">91.76% accuracy</text><text x="85" y="337" font-size="19" fill="#406577">EfficientNetB0 weighted F1: 0.9185 · 1,092 evaluated images</text><rect x="80" y="363" width="1040" height="77" rx="12" fill="#edf2f6" stroke="#d0e1eb"/><text x="98" y="393" font-size="18" font-weight="700" fill="#263f55">Critical evaluation limitation</text><text x="98" y="420" font-size="17" fill="#536f82">Validation and reported test both reuse the same 30% directory subset: NO independent test set.</text><text x="54" y="564" font-size="15" fill="#577387">Original outputs. Baseline and EfficientNet also used different input preprocessing; not a controlled test comparison.</text></g></svg>