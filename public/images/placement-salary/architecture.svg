<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Student Placement and Salary Prediction Architecture</title>
<desc id="desc">Student dataset flows through preprocessing, training and MLflow to serialized models; models support Streamlit monolithic deployment and FastAPI plus Streamlit decoupled deployment.</desc>
<defs>
  <linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#172A43"/><stop offset="1" stop-color="#284B68"/></linearGradient>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1L7 4.5L1 8" fill="none" stroke="#5C829B" stroke-width="1.4"/></marker>
</defs>
<rect width="1200" height="620" rx="30" fill="#F5F7FA"/>
<rect x="24" y="24" width="1152" height="572" rx="24" fill="white" stroke="#DCE5ED"/>
<rect x="56" y="54" width="1088" height="88" rx="16" fill="url(#b)"/>
<text x="84" y="90" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="white">Student Placement &amp; Salary Prediction</text>
<text x="84" y="120" font-family="Arial,sans-serif" font-size="16" fill="#C6D5E5">End-to-end ML workflow · Model Deployment Midterm</text>
<!-- training pipeline -->
<g font-family="Arial,sans-serif">
<text x="76" y="197" fill="#527694" font-size="15" font-weight="700" letter-spacing="2">EXPERIMENTATION PIPELINE</text>
<rect x="70" y="220" rx="14" width="228" height="112" fill="#EBF1F5" stroke="#CEDCE6"/>
<text x="184" y="251" text-anchor="middle" fill="#18304B" font-weight="700" font-size="19">Student Data</text>
<text x="184" y="277" text-anchor="middle" fill="#4F687B" font-size="15">5,000 records</text>
<text x="184" y="299" text-anchor="middle" fill="#4F687B" font-size="15">18 attributes</text>
<rect x="350" y="220" rx="14" width="228" height="112" fill="#EBF1F5" stroke="#CEDCE6"/>
<text x="464" y="251" text-anchor="middle" fill="#18304B" font-weight="700" font-size="18">Data Pipeline</text>
<text x="464" y="277" text-anchor="middle" fill="#4F687B" font-size="14">Preprocessing</text>
<text x="464" y="299" text-anchor="middle" fill="#4F687B" font-size="14">Feature engineering</text>
<rect x="630" y="220" rx="14" width="228" height="112" fill="#EBF1F5" stroke="#CEDCE6"/>
<text x="744" y="251" text-anchor="middle" fill="#18304B" font-weight="700" font-size="19">Model Training</text>
<text x="744" y="277" text-anchor="middle" fill="#4F687B" font-size="15">Classification + Regression</text>
<text x="744" y="299" text-anchor="middle" fill="#4F687B" font-size="15">Grid Search · Optuna</text>
<rect x="910" y="220" rx="14" width="228" height="112" fill="#EBF1F5" stroke="#CEDCE6"/>
<text x="1024" y="251" text-anchor="middle" fill="#18304B" font-weight="700" font-size="19">MLflow</text>
<text x="1024" y="277" text-anchor="middle" fill="#4F687B" font-size="15">26 logged runs</text>
<text x="1024" y="299" text-anchor="middle" fill="#4F687B" font-size="15">Model artifacts</text>
<path d="M299 275H340 M579 275H620 M859 275H900" fill="none" stroke="#5C829B" stroke-width="2.5" marker-end="url(#arrow)"/>
<!-- deployment -->
<path d="M744 333V383" fill="none" stroke="#5C829B" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="76" y="395" fill="#527694" font-size="15" font-weight="700" letter-spacing="2">DEPLOYMENT ARCHITECTURES</text>
<rect x="70" y="416" rx="15" width="515" height="119" fill="#E9F2EF" stroke="#A7C9BD"/>
<text x="96" y="449" fill="#285F4C" font-size="14" font-weight="700">MONOLITHIC</text>
<text x="96" y="481" fill="#173A2E" font-size="20" font-weight="700">Streamlit application</text>
<text x="96" y="511" fill="#487265" font-size="15">UI + model inference in one app</text>
<rect x="615" y="416" rx="15" width="523" height="119" fill="#EDF1F9" stroke="#B9C8E0"/>
<text x="643" y="449" fill="#35587F" font-size="14" font-weight="700">DECOUPLED</text>
<text x="643" y="481" fill="#172E4D" font-size="20" font-weight="700">Streamlit → FastAPI</text>
<text x="643" y="511" fill="#516783" font-size="15">Frontend + REST model-serving API</text>
<path d="M744 366H327V407 M744 366H876V407" fill="none" stroke="#5C829B" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="600" y="572" fill="#64778B" font-size="14" text-anchor="middle">Conceptual diagram based on the submitted project architecture</text>
</g>
</svg>
