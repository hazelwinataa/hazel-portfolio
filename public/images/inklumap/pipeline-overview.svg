<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-label="InkluMap flow from assessment data to clustering, recommendations, backend and frontend">
<rect x="0" y="0" width="1200" height="560" fill="#f8fafc"/>
<text x="65" y="65" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#1c3655">From functional assessments to actionable support</text>
<text x="65" y="101" font-family="Arial, sans-serif" font-size="17" fill="#64748b">Source-backed architecture from the published InkluMap repository</text>
<defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,1 L7,4 L0,7" fill="none" stroke="#68859f" stroke-width="1.7"/></marker></defs>
<g font-family="Arial, sans-serif">
<rect x="56" y="150" width="250" height="133" rx="18" fill="#e8f0fa" stroke="#b5c9e1"/>
<text x="80" y="192" font-size="19" font-weight="bold" fill="#1b3558">Assessment records</text>
<text x="80" y="222" font-size="16" fill="#46617d">120 synthetic students</text><text x="80" y="247" font-size="16" fill="#46617d">96 complete cases</text>
<rect x="361" y="150" width="250" height="133" rx="18" fill="#e8f4f3" stroke="#b0d6d1"/>
