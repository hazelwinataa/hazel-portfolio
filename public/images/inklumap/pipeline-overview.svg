<text x="385" y="222" font-size="16" fill="#476e6d">8 ordinal domains</text><text x="385" y="247" font-size="16" fill="#476e6d">+ preferences / tools</text>
<rect x="666" y="150" width="470" height="133" rx="18" fill="#e9edf6" stroke="#c2cce0"/>
<text x="691" y="189" font-size="19" font-weight="bold" fill="#233f69">Unsupervised learning</text>
<text x="691" y="219" font-size="16" fill="#47617e">K-Means baseline · Hierarchical + Gower (selected)</text>
<text x="691" y="247" font-size="16" fill="#47617e">DBSCAN unique-case detection · five needs groups</text>
<path d="M313 216 H354" fill="none" stroke="#68859f" stroke-width="3" marker-end="url(#arr)"/>
<path d="M618 216 H656" fill="none" stroke="#68859f" stroke-width="3" marker-end="url(#arr)"/>
<rect x="56" y="365" width="335" height="130" rx="18" fill="#fef8ec" stroke="#e5d3ad"/>
