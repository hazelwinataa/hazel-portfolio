<text x="460" y="434" font-size="16" fill="#516b86">FastAPI · PostgreSQL · SQLAlchemy</text>
<text x="460" y="461" font-size="16" fill="#516b86">Analytics REST endpoints</text>
<rect x="812" y="365" width="324" height="130" rx="18" fill="#e8f0fa" stroke="#bdcee2"/>
<text x="836" y="405" font-size="19" font-weight="bold" fill="#203e65">Next.js dashboard</text>
<text x="836" y="434" font-size="16" fill="#496784">Students · needs groups · recommendations</text>
<text x="836" y="461" font-size="16" fill="#496784">Budget priorities · printable reports</text>
