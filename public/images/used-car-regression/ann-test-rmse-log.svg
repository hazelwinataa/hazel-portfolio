<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590"><rect width="1200" height="590" rx="20" fill="#f6f9fc"/><g font-family="Arial,sans-serif"><text x="54" y="58" font-size="30" font-weight="700" fill="#142d43">Used-car ANN · Test-set prediction error</text><text x="54" y="91" font-size="17" fill="#4d7186">RMSE on log1p(selling_price) · lower is better · extracted from original notebook evaluation</text><rect x="55" y="139" width="1090" height="332" rx="18" fill="#fff" stroke="#d7e3ec"/><text x="87" y="201" font-size="21" fill="#2e4a60">Baseline ANN</text><rect x="345" y="169" width="645" height="50" rx="9" fill="#e3edf3"/><rect x="345" y="169" width="600" height="50" rx="9" fill="#759aa8"/><text x="1010" y="201" font-size="24" font-weight="700" fill="#1f3a50">0.2985</text><text x="87" y="305" font-size="21" fill="#2e4a60">Modified ANN</text><rect x="345" y="273" width="645" height="50" rx="9" fill="#e3edf3"/><rect x="345" y="273" width="527" height="50" rx="9" fill="#167f90"/><text x="1010" y="305" font-size="24" font-weight="700" fill="#1f3a50">0.2625</text><text x="86" y="412" font-size="18" fill="#38596b">Modified model reduced test RMSE by approximately 12.1% relative to baseline.</text><text x="86" y="438" font-size="16" fill="#60798b">The metric is NOT an average dollar error; predictions were assessed on the log-price target.</text><text x="54" y="564" font-size="15" fill="#577387">Replotted from the original SOAL_1.ipynb results. The source dataset was not rerun.</text></g></svg>